name: ROS 2 CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    container:
      image: osrf/ros:humble-desktop-full
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Install everything package.xml declares (numpy, pytest, linters, ...)
      # so the job does not depend on what happens to be in the image.
      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src -y --rosdistro humble

      - name: Build workspace
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install

      # colcon test runs every test but does not itself fail on test
      # failures; colcon test-result exits non-zero if ANY test failed,
      # which is what fails the job.
      - name: Run tests
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
